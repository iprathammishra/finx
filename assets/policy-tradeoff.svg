<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc">
<title id="title">More approvals do not always create more value</title><desc id="desc">An illustrative contribution curve peaks at 60 percent approvals: four lakh at 40 percent, six lakh at 60 percent and three lakh at 80 percent.</desc>
