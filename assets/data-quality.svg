<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="title desc">
<title id="title">A barrier at decision time</title><desc id="desc">Records available before time T feed the timeline; a later publication is blocked from moving backward into the decision.</desc>
