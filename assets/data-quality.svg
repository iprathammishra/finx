<g fill="#222" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif"><text x="53" y="42" font-size="19" text-anchor="start" font-weight="400">When did the fact become knowable?</text><text x="93" y="280" font-size="15" text-anchor="start" font-weight="400">Available evidence</text><text x="418" y="292" font-size="14" text-anchor="middle" font-weight="400">Decision time T</text><text x="562" y="71" font-size="14" text-anchor="start" font-weight="400">Later publication</text><text x="562" y="278" font-size="14" text-anchor="start" font-weight="400">Not a feature at T</text></g></svg>