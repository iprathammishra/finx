<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="title desc">
<title id="title">A recommendation with a stopping rule</title><desc id="desc">A pilot branches according to whether it meets a predeclared test, leading to scale carefully or revise or stop.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#222" stroke-width="1.3"/></marker></defs>
<rect width="760" height="320" fill="white"/>
<g fill="none" stroke="#222" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M93 170H258L339 91H465 M258 170L339 248H465" /><circle cx="93" cy="170" r="5" /><circle cx="258" cy="170" r="7" /><path d="M467 91L540 91" marker-end="url(#arrow)"/><path d="M467 248L540 248" marker-end="url(#arrow)"/><rect x="563" y="65" width="138" height="52" /><rect x="563" y="222" width="138" height="52" /></g>
<g fill="#222" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif"><text x="60" y="134" font-size="17" text-anchor="start" font-weight="400">Run a pilot</text><text x="258" y="48" font-size="18" text-anchor="middle" font-weight="400">Decide what evidence would change your mind.</text><text x="343" y="78" font-size="14" text-anchor="start" font-weight="400">Meets the test</text><text x="345" y="275" font-size="14" text-anchor="start" font-weight="400">Misses the test</text><text x="632" y="97" font-size="15" text-anchor="middle" font-weight="400">Scale carefully</text><text x="632" y="254" font-size="15" text-anchor="middle" font-weight="400">Revise or stop</text><text x="82" y="310" font-size="16" text-anchor="start" font-weight="400">Set the rule before seeing the result.</text></g></svg>